<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Cell Painting screen of metabolic modulators</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.css" />
  <style>
    #loading { font-family: sans-serif; text-align: center; margin-top: 15vh; color: #444; }
  </style>
</head>
<body>
  <div id="loading">
    <h2>Cell Painting screen of metabolic modulators</h2>
    <p>Loading the analysis app in your browser&hellip;<br>
    The first visit takes about 20&ndash;60 seconds (Python is downloaded once and then cached).<br>
    Files you upload are processed in your browser and are not sent anywhere.</p>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.js";
    const files = {
      "src/cpmetab/__init__.py": {
            "url": "./files/src/cpmetab/u__init__.py"
      },
      "src/cpmetab/cli.py": {
            "url": "./files/src/cpmetab/cli.py"
      },
      "src/cpmetab/config.py": {
            "url": "./files/src/cpmetab/config.py"
      },
      "src/cpmetab/distance.py": {
            "url": "./files/src/cpmetab/distance.py"
      },
      "src/cpmetab/distributions.py": {
            "url": "./files/src/cpmetab/distributions.py"
      },
      "src/cpmetab/io.py": {
            "url": "./files/src/cpmetab/io.py"
      },
      "src/cpmetab/kde.py": {
            "url": "./files/src/cpmetab/kde.py"
      },
      "src/cpmetab/pipeline.py": {
            "url": "./files/src/cpmetab/pipeline.py"
      },
      "src/cpmetab/plots.py": {
            "url": "./files/src/cpmetab/plots.py"
      },
      "src/cpmetab/reproducibility.py": {
            "url": "./files/src/cpmetab/reproducibility.py"
      },
      "src/cpmetab/synthetic.py": {
            "url": "./files/src/cpmetab/synthetic.py"
      },
      "src/cpmetab/toxicity.py": {
            "url": "./files/src/cpmetab/toxicity.py"
      },
      "app/streamlit_app.py": {
            "url": "./files/app/streamlit_app.py"
      }
};
    mount(
      {
        requirements: ["numpy", "pandas", "scipy", "matplotlib", "seaborn", "openpyxl", "brokenaxes", "joypy"],
        entrypoint: "app/streamlit_app.py",
        files: files,
      },
      document.getElementById("root"),
    );
    // hide the loading note once Streamlit has drawn something
    const obs = new MutationObserver(() => {
      if (document.getElementById("root").children.length) {
        document.getElementById("loading").style.display = "none";
        obs.disconnect();
      }
    });
    obs.observe(document.getElementById("root"), { childList: true });
  </script>
</body>
</html>
